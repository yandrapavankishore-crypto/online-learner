
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-learning-ingress
  namespace: online-learning
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: online-learning-service
                port:
                  number: 80
