
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-learning
  namespace: online-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-learning
  template:
    metadata:
      labels:
        app: online-learning
    spec:
      containers:
        - name: online-learning
          image: yandrapavankishore/online-learning:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
